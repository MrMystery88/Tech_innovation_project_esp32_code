; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	esp32async/ESPAsyncWebServer@^3.11.0
	esp32async/AsyncTCP@^3.4.10
	madhephaestus/ESP32Servo@^3.2.0
	adafruit/Adafruit MPU6050@^2.2.9
	electroniccats/MPU6050@^1.4.4

